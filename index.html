<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>713 Thunderbolt RCACS - Royal Canadian Air Cadets</title>
  <meta name="description" content="Official platform for the 713 Thunderbolt Royal Canadian Air Cadet Squadron in Stoney Creek / Hamilton. Training youth ages 12-18 in aviation, leadership, and survival skills.">
  
  <!-- Premium Typography Links -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. ROYAL CANADIAN AIR CADET COLOR SCHEMA & BASICS
       ========================================================================== */
    :root {
      --primary-bg: #0a1224;       /* Deep Aerospace Midnight Blue */
      --card-bg: #131f3b;          /* Sleek Dark Navy Container Blue */
      --accent-cyan: #00f2fe;      /* Electric Thunderbolt Lightning Cyan */
      --accent-blue: #3a86ff;      /* Royal Air Force Blue Accent */
      --text-main: #f8fafc;        /* High-Visibility White */
      --text-muted: #94a3b8;       /* Cockpit Radar Gray */
      --glass-glow: rgba(0, 242, 254, 0.15);
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--primary-bg);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* ==========================================================================
       2. PREMIUM APP LAYOUT & ANIMATIONS 
       ========================================================================== */
    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                  0 0 40px rgba(0, 242, 254, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      padding: 2.5rem;
      
      /* Smooth Entrance Animation */
      animation: squadronEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    @keyframes squadronEntrance {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       3. HERO / RCACS INTRO SECTION
       ========================================================================== */
    .welcome-section {
      text-align: center;
      margin-bottom: 3rem;
    }

    .welcome-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-main) 40%, var(--accent-cyan));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .welcome-subtitle {
      color: var(--accent-blue);
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
    }

    .thunder-emoji {
      font-size: 2.2rem;
      filter: drop-shadow(0 0 12px var(--accent-cyan));
      animation: thunderPulse 2s ease-in-out infinite;
    }

    @keyframes thunderPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--accent-cyan)); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 15px var(--accent-cyan)); }
    }

    .welcome-text {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto 2.5rem auto;
    }

    .welcome-text strong {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Image Wrapper with Precision Pilot Theme */
    .storefront-image-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: var(--transition-smooth);
    }

    .storefront-image-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(10, 18, 36, 0.85));
      pointer-events: none;
    }

    .storefront-image {
      width: 100%;
      display: block;
      height: auto;
      object-fit: cover;
      transition: var(--transition-smooth);
    }

    /* Interactive image zoom action */
    .storefront-image-wrapper:hover .storefront-image {
      transform: scale(1.03);
    }
    
    .storefront-image-wrapper:hover {
      box-shadow: 0 20px 40px var(--glass-glow);
      border-color: rgba(0, 242, 254, 0.3);
    }

    /* ==========================================================================
       4. AUTHENTIC CADET DISCIPLINE & OPERATIONS GRID
       ========================================================================== */
    .services-section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    /* Tactical Service Chips with Individual Floating Delay */
    .services-grid span {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      transition: var(--transition-smooth);
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .services-grid span:hover {
      background: linear-gradient(135deg, rgba(58, 134, 255, 0.15), rgba(0, 242, 254, 0.15));
      color: var(--accent-cyan);
      border-color: rgba(0, 242, 254, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.15);
    }

    .divider {
      border: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
      margin: 2.5rem 0;
    }

    /* ==========================================================================
       5. REAL LOGISTICAL DATA CARD (SQUADRON DETAILS)
       ========================================================================== */
    .info-section {
      margin-bottom: 3rem;
    }

    .info-card {
      background: rgba(10, 18, 36, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-left: 4px solid var(--accent-blue);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .info-item {
      font-size: 1rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .info-item strong {
      color: var(--text-main);
      font-weight: 600;
      min-width: 110px;
    }

    /* ==========================================================================
       6. INTERACTIVE CTA BUTTON WITH PULSE EFFECT
       ========================================================================== */
    .order-button-container {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }

    .order-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
      color: #050a14; /* Max contrast dark text for usability */
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 16px 40px;
      border-radius: 14px;
      letter-spacing: 0.5px;
      transition: var(--transition-smooth);
      box-shadow: 0 15px 30px rgba(0, 242, 254, 0.2);
    }

    /* Radar Glow Animation behind Action Button */
    .order-button::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: inherit;
      z-index: -1;
      transition: var(--transition-smooth);
      animation: radarPulse 2.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes radarPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.25, 1.45); opacity: 0; }
    }

    .order-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0, 242, 254, 0.4);
    }

    .order-button:active {
      transform: translateY(-1px);
    }

    /* ==========================================================================
       7. STREAMLINED FOOTER
       ========================================================================== */
    .footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Responsive Grid Breakpoints */
    @media (max-width: 600px) {
      .container { padding: 1.5rem; }
      .welcome-title { font-size: 1.8rem; }
      .services-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .order-button { width: 100%; }
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Header Section -->
    <div class="welcome-section">
      <h1 class="welcome-title">
